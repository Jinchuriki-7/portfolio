<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0e2340" />
      <stop offset="100%" stop-color="#061220" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Blobs -->
  <circle cx="850" cy="250" r="280" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="300" cy="450" r="240" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />

  <!-- Main Window -->
  <rect x="80" y="80" width="1040" height="515" rx="16" fill="#081b30" stroke="#123b60" stroke-width="2" />
  
  <!-- Header -->
  <rect x="80" y="80" width="1040" height="52" rx="16" fill="#0c2642" />
  <rect x="80" y="116" width="1040" height="16" fill="#0c2642" />
  <circle cx="115" cy="106" r="6" fill="#ef4444" />
  <circle cx="135" cy="106" r="6" fill="#f59e0b" />
  <circle cx="155" cy="106" r="6" fill="#10b981" />
  <text x="600" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    ByeByte AI — Cross-Platform System Optimizer (Windows &amp; Android)
  </text>

  <!-- Left: Info -->
  <g transform="translate(130, 180)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="110" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22d3ee" text-anchor="middle">
      CROSS-PLATFORM CLEANER
    </text>

    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#f8fafc">
      ByeByte AI
    </text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#cyanBlue)">
      Hardware Telemetry
    </text>

    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Flutter &amp; Dart MVVM System Architecture
    </text>
    <text x="0" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Zero-Risk Recovery Sandboxing &amp; Storage Reclamation
    </text>

    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="170" height="65" rx="10" fill="#0b294a" stroke="#164e63" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">JUNK CLEANED</text>
      <text x="15" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">14.8 GB</text>

      <rect x="185" y="0" width="170" height="65" rx="10" fill="#0b294a" stroke="#164e63" stroke-width="1"/>
      <text x="200" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4ade80">RAM OPTIMIZED</text>
      <text x="200" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">+34% Free</text>
    </g>
  </g>

  <!-- Right: Dashboard Preview -->
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="500" height="395" rx="14" fill="#061626" stroke="#103a5e" stroke-width="1.5" />
    
    <!-- Gauges -->
    <g transform="translate(35, 30)">
      <circle cx="80" cy="80" r="60" fill="none" stroke="#0e2a44" stroke-width="12" />
      <circle cx="80" cy="80" r="60" fill="none" stroke="#06b6d4" stroke-width="12" stroke-dasharray="280" stroke-dashoffset="80" stroke-linecap="round" />
      <text x="80" y="75" font-family="monospace" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">68%</text>
      <text x="80" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Storage</text>
    </g>

    <g transform="translate(260, 30)">
      <circle cx="80" cy="80" r="60" fill="none" stroke="#0e2a44" stroke-width="12" />
      <circle cx="80" cy="80" r="60" fill="none" stroke="#3b82f6" stroke-width="12" stroke-dasharray="280" stroke-dashoffset="140" stroke-linecap="round" />
      <text x="80" y="75" font-family="monospace" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">42%</text>
      <text x="80" y="95" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Memory</text>
    </g>

    <!-- Cleaning Modules List -->
    <g transform="translate(35, 190)">
      <rect x="0" y="0" width="430" height="48" rx="8" fill="#0a223c" stroke="#123b60" stroke-width="1" />
      <circle cx="25" cy="24" r="8" fill="#22c55e" />
      <text x="45" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">System Cache &amp; Temp Logs</text>
      <text x="410" y="29" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">4.2 GB</text>

      <rect x="0" y="60" width="430" height="48" rx="8" fill="#0a223c" stroke="#123b60" stroke-width="1" />
      <circle cx="25" cy="84" r="8" fill="#22c55e" />
      <text x="45" y="89" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Duplicate Media &amp; Large Files</text>
      <text x="410" y="89" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">8.9 GB</text>

      <rect x="0" y="120" width="430" height="48" rx="8" fill="#0a223c" stroke="#123b60" stroke-width="1" />
      <circle cx="25" cy="144" r="8" fill="#3b82f6" />
      <text x="45" y="149" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Background Task Throttler</text>
      <text x="410" y="149" font-family="monospace" font-size="12" font-weight="700" fill="#4ade80" text-anchor="end">OPTIMIZED</text>
    </g>
  </g>
</svg>
