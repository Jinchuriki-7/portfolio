<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#112d4e" />
      <stop offset="100%" stop-color="#071526" />
    </linearGradient>
    <linearGradient id="skyCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Main Window -->
  <rect x="80" y="80" width="1040" height="515" rx="16" fill="#0c203b" stroke="#1c4779" stroke-width="2" />
  
  <!-- Header -->
  <rect x="80" y="80" width="1040" height="52" rx="16" fill="#112b50" />
  <rect x="80" y="116" width="1040" height="16" fill="#112b50" />
  <circle cx="115" cy="106" r="6" fill="#ef4444" />
  <circle cx="135" cy="106" r="6" fill="#f59e0b" />
  <circle cx="155" cy="106" r="6" fill="#10b981" />
  <text x="600" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Real-Time Weather App (C++17 + OpenWeather REST API)
  </text>

  <!-- Left Info -->
  <g transform="translate(130, 180)">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text x="95" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
      METEOROLOGY API
    </text>

    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#f8fafc">
      Real-Time Weather
    </text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="url(#skyCyan)">
      Atmospheric Forecasts
    </text>

    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Queries Live Global Meteorological Feeds
    </text>
    <text x="0" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Temperature, Humidity, Pressure &amp; Comprehensive Network Error Handling
    </text>

    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="170" height="65" rx="10" fill="#0f2b4e" stroke="#0284c7" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7dd3fc">TEMPERATURE</text>
      <text x="15" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">27°C / 81°F</text>

      <rect x="185" y="0" width="170" height="65" rx="10" fill="#0f2b4e" stroke="#0284c7" stroke-width="1"/>
      <text x="200" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a5b4fc">HUMIDITY</text>
      <text x="200" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">64% Live</text>
    </g>
  </g>

  <!-- Right Weather Radar Card -->
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="500" height="395" rx="12" fill="#08182c" stroke="#163e6e" stroke-width="1.5" />
    
    <g transform="translate(30, 25)">
      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Dhaka, Bangladesh</text>
      <text x="0" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Updated Just Now • OpenWeather Sync</text>
      
      <!-- Big Temp -->
      <text x="440" y="45" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#38bdf8" text-anchor="end">28°C</text>

      <!-- Weather Stats Grid -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="210" height="85" rx="10" fill="#0d2644" stroke="#1d4f82" stroke-width="1" />
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">WIND SPEED</text>
        <text x="15" y="60" font-family="monospace" font-size="20" font-weight="800" fill="#f8fafc">14 km/h</text>

        <rect x="230" y="0" width="210" height="85" rx="10" fill="#0d2644" stroke="#1d4f82" stroke-width="1" />
        <text x="245" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">AIR PRESSURE</text>
        <text x="245" y="60" font-family="monospace" font-size="20" font-weight="800" fill="#f8fafc">1012 hPa</text>
      </g>

      <!-- Forecast Bar -->
      <g transform="translate(0, 185)">
        <rect x="0" y="0" width="440" height="135" rx="10" fill="#0d2644" stroke="#1d4f82" stroke-width="1" />
        <text x="20" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">5-DAY FORECAST OVERVIEW</text>
        
        <g transform="translate(20, 50)" font-family="system-ui, sans-serif" font-size="12">
          <text x="20" y="15" fill="#94a3b8">Mon</text>
          <text x="110" y="15" fill="#94a3b8">Tue</text>
          <text x="200" y="15" fill="#94a3b8">Wed</text>
          <text x="290" y="15" fill="#94a3b8">Thu</text>
          <text x="380" y="15" fill="#94a3b8">Fri</text>

          <text x="20" y="45" font-weight="800" fill="#38bdf8">28°</text>
          <text x="110" y="45" font-weight="800" fill="#38bdf8">29°</text>
          <text x="200" y="45" font-weight="800" fill="#818cf8">26°</text>
          <text x="290" y="45" font-weight="800" fill="#38bdf8">27°</text>
          <text x="380" y="45" font-weight="800" fill="#38bdf8">28°</text>
        </g>
      </g>
    </g>
  </g>
</svg>
