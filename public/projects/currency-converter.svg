<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1720" />
      <stop offset="50%" stop-color="#142c38" />
      <stop offset="100%" stop-color="#09141c" />
    </linearGradient>
    <linearGradient id="goldGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Main Window -->
  <rect x="80" y="80" width="1040" height="515" rx="16" fill="#0c1d28" stroke="#1d4558" stroke-width="2" />
  
  <!-- Header -->
  <rect x="80" y="80" width="1040" height="52" rx="16" fill="#122a3a" />
  <rect x="80" y="116" width="1040" height="16" fill="#122a3a" />
  <circle cx="115" cy="106" r="6" fill="#ef4444" />
  <circle cx="135" cy="106" r="6" fill="#f59e0b" />
  <circle cx="155" cy="106" r="6" fill="#10b981" />
  <text x="600" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Modern C++17 Real-Time Currency Converter (libcurl + nlohmann/json)
  </text>

  <!-- Left Info -->
  <g transform="translate(130, 180)">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#eab308" fill-opacity="0.15" stroke="#eab308" stroke-width="1" />
    <text x="95" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">
      MODERN C++17 ENGINE
    </text>

    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#f8fafc">
      Currency Converter
    </text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="url(#goldGreen)">
      Live Forex REST Feed
    </text>

    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      150+ International Currencies Queried in Real-Time
    </text>
    <text x="0" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Optimized memory, zero leaks, JSON parsing with nlohmann
    </text>

    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="170" height="65" rx="10" fill="#132f3e" stroke="#047857" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#34d399">LATENCY</text>
      <text x="15" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">&lt; 120ms</text>

      <rect x="185" y="0" width="170" height="65" rx="10" fill="#132f3e" stroke="#047857" stroke-width="1"/>
      <text x="200" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#facc15">CURRENCY PAIRS</text>
      <text x="200" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">150+ Live</text>
    </g>
  </g>

  <!-- Right Forex Terminal Cards -->
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="500" height="395" rx="12" fill="#08151e" stroke="#16394a" stroke-width="1.5" />
    
    <g transform="translate(30, 25)">
      <!-- Pair 1 -->
      <rect x="0" y="0" width="440" height="70" rx="10" fill="#0f2634" stroke="#1d4d68" stroke-width="1" />
      <text x="20" y="40" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">USD / BDT</text>
      <text x="420" y="40" font-family="monospace" font-size="20" font-weight="800" fill="#34d399" text-anchor="end">122.45 ৳</text>
      <text x="20" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Real-Time Forex Exchange • Verified</text>

      <!-- Pair 2 -->
      <rect x="0" y="85" width="440" height="70" rx="10" fill="#0f2634" stroke="#1d4d68" stroke-width="1" />
      <text x="20" y="125" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">EUR / USD</text>
      <text x="420" y="125" font-family="monospace" font-size="20" font-weight="800" fill="#60a5fa" text-anchor="end">1.0874 $</text>
      <text x="20" y="143" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">European Central Bank Reference Feed</text>

      <!-- Pair 3 -->
      <rect x="0" y="170" width="440" height="70" rx="10" fill="#0f2634" stroke="#1d4d68" stroke-width="1" />
      <text x="20" y="210" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">GBP / BDT</text>
      <text x="420" y="210" font-family="monospace" font-size="20" font-weight="800" fill="#facc15" text-anchor="end">154.20 ৳</text>
      <text x="20" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Bank of England Cross Rates</text>

      <!-- Status banner -->
      <rect x="0" y="260" width="440" height="60" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="1" />
      <circle cx="30" cy="290" r="8" fill="#22c55e" />
      <text x="50" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#86efac">
        C++17 Engine Connected: libcurl TLS 1.3
      </text>
    </g>
  </g>
</svg>
