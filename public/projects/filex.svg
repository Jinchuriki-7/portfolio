<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#181938" />
      <stop offset="100%" stop-color="#0d0e22" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Background Glows -->
  <circle cx="850" cy="300" r="300" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
  <circle cx="300" cy="200" r="220" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />

  <!-- Main Window -->
  <rect x="80" y="80" width="1040" height="515" rx="16" fill="#10132b" stroke="#2a2e57" stroke-width="2" />

  <!-- Header -->
  <rect x="80" y="80" width="1040" height="52" rx="16" fill="#171b3d" />
  <rect x="80" y="116" width="1040" height="16" fill="#171b3d" />
  <circle cx="115" cy="106" r="6" fill="#ef4444" />
  <circle cx="135" cy="106" r="6" fill="#f59e0b" />
  <circle cx="155" cy="106" r="6" fill="#10b981" />
  <text x="600" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    FileX — Floating Drag-and-Drop Desktop Converter for Windows
  </text>

  <!-- Left Side: Branding -->
  <g transform="translate(130, 180)">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" />
    <text x="95" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">
      WINDOWS DESKTOP APP
    </text>

    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#f8fafc">
      FileX
    </text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#purpleGradient)">
      Universal Converter
    </text>

    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Floating Always-On-Top Multithreaded Engine
    </text>
    <text x="0" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Instant conversion for PDF, Images, Word, Audio &amp; Video
    </text>

    <!-- Format Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="70" height="32" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="35" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">PDF</text>

      <rect x="80" y="0" width="70" height="32" rx="8" fill="#311042" stroke="#86198f" stroke-width="1"/>
      <text x="115" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#f0abfc" text-anchor="middle">DOCX</text>

      <rect x="160" y="0" width="70" height="32" rx="8" fill="#06322b" stroke="#047857" stroke-width="1"/>
      <text x="195" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">PNG</text>

      <rect x="240" y="0" width="70" height="32" rx="8" fill="#3b1b0b" stroke="#c2410c" stroke-width="1"/>
      <text x="275" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#fdba74" text-anchor="middle">MP4</text>
    </g>
  </g>

  <!-- Right Side: Floating App Widget Mockup -->
  <g transform="translate(600, 155)">
    <!-- Widget Body -->
    <rect x="0" y="0" width="460" height="400" rx="20" fill="#16193d" stroke="#4f46e5" stroke-width="2" filter="url(#glow)" />
    
    <!-- Widget Header -->
    <rect x="0" y="0" width="460" height="50" rx="20" fill="#1f2352" />
    <rect x="0" y="30" width="460" height="20" fill="#1f2352" />
    <circle cx="30" cy="25" r="7" fill="#6366f1" />
    <text x="50" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">FileX Floating Dock</text>
    <rect x="390" y="16" width="45" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <text x="412" y="29" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">ACTIVE</text>

    <!-- Drop Zone -->
    <rect x="30" y="70" width="400" height="190" rx="16" fill="#0f112e" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="230" cy="140" r="30" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
    <path d="M 230 125 L 230 155 M 218 137 L 230 125 L 242 137" stroke="#818cf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="230" y="195" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" text-anchor="middle">Drag &amp; Drop Files Here</text>
    <text x="230" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#818cf8" text-anchor="middle">Supports over 50+ extensions</text>

    <!-- Progress Status Bar -->
    <rect x="30" y="280" width="400" height="85" rx="12" fill="#0f112e" stroke="#2a2e57" stroke-width="1" />
    <text x="50" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Report_Annual_2026.docx → PDF</text>
    <text x="395" y="308" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">100% DONE</text>
    <rect x="50" y="325" width="360" height="8" rx="4" fill="#1e1b4b" />
    <rect x="50" y="325" width="360" height="8" rx="4" fill="url(#purpleGradient)" />
    <text x="50" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Processed in 0.42s • Background Thread Safe</text>
  </g>
</svg>
