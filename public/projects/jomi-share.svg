<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e" />
      <stop offset="50%" stop-color="#0a2233" />
      <stop offset="100%" stop-color="#051722" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Glowing Radial Blobs -->
  <circle cx="950" cy="200" r="280" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="250" cy="500" r="220" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Main UI Window Mockup -->
  <rect x="80" y="80" width="1040" height="515" rx="16" fill="#081826" stroke="#13384c" stroke-width="2" />
  
  <!-- Window Header Bar -->
  <rect x="80" y="80" width="1040" height="52" rx="16" fill="#0c2336" />
  <rect x="80" y="116" width="1040" height="16" fill="#0c2336" />
  <circle cx="115" cy="106" r="6" fill="#ef4444" />
  <circle cx="135" cy="106" r="6" fill="#f59e0b" />
  <circle cx="155" cy="106" r="6" fill="#10b981" />
  
  <text x="600" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    jomi-share-portal.web.app • Land Intelligence &amp; Dispute Resolution Ecosystem
  </text>

  <!-- Content Split: Left Info + Right GIS Map Preview -->
  <!-- Left Side: Product Branding -->
  <g transform="translate(130, 180)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="110" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">
      AI LAND INTELLIGENCE
    </text>

    <!-- Title -->
    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">
      JOMI-SHARE &amp;
    </text>
    <text x="0" y="125" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="url(#accent)">
      NIRBASH
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      National Smart E-Governance Land DNA™ Index
    </text>
    <text x="0" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Automated Land Record Verification &amp; AI Dispute Resolution
    </text>

    <!-- Mini Feature Cards -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="180" height="70" rx="10" fill="#0f2b3e" stroke="#164e63" stroke-width="1" />
      <text x="15" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22d3ee">LAND DNA™ INDEX</text>
      <text x="15" y="50" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f1f5f9">100% Verified</text>

      <rect x="195" y="0" width="180" height="70" rx="10" fill="#0f2b3e" stroke="#164e63" stroke-width="1" />
      <text x="210" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">SURVEYOR DISPATCH</text>
      <text x="210" y="50" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f1f5f9">Real-Time GIS</text>
    </g>
  </g>

  <!-- Right Side: GIS Map Polygon & Audit Preview -->
  <g transform="translate(580, 160)">
    <!-- Map Canvas Container -->
    <rect x="0" y="0" width="500" height="395" rx="12" fill="#05141f" stroke="#0e3a52" stroke-width="1.5" />
    
    <!-- Map Grid Lines -->
    <g stroke="#0e2a3c" stroke-width="1" opacity="0.6">
      <line x1="0" y1="80" x2="500" y2="80" />
      <line x1="0" y1="160" x2="500" y2="160" />
      <line x1="0" y1="240" x2="500" y2="240" />
      <line x1="0" y1="320" x2="500" y2="320" />
      <line x1="100" y1="0" x2="100" y2="395" />
      <line x1="200" y1="0" x2="200" y2="395" />
      <line x1="300" y1="0" x2="300" y2="395" />
      <line x1="400" y1="0" x2="400" y2="395" />
    </g>

    <!-- GIS Polygons (Land plots) -->
    <polygon points="60,90 190,70 230,170 80,180" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2" />
    <circle cx="140" cy="125" r="4" fill="#34d399" />
    <text x="140" y="145" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">PLOT-104B</text>

    <polygon points="250,110 380,85 410,210 270,225" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="2" />
    <circle cx="330" cy="155" r="4" fill="#22d3ee" />
    <text x="330" y="175" font-family="monospace" font-size="10" font-weight="700" fill="#bae6fd" text-anchor="middle">PLOT-105A</text>

    <polygon points="120,220 250,210 220,330 90,310" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2" />
    <circle cx="170" cy="270" r="4" fill="#60a5fa" />
    <text x="170" y="290" font-family="monospace" font-size="10" font-weight="700" fill="#bfdbfe" text-anchor="middle">DISPUTE: RESOLVED</text>

    <!-- Floating Verification Modal -->
    <rect x="220" y="235" width="250" height="135" rx="10" fill="#092030" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
    <text x="240" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">✓ SMART CONTRACT AUDIT</text>
    <text x="240" y="290" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Khatian &amp; Mouza Match</text>
    <text x="240" y="312" font-family="monospace" font-size="10" fill="#94a3b8">Hash: 0x8f2a...7c91</text>
    <rect x="240" y="325" width="100" height="24" rx="4" fill="#10b981" />
    <text x="290" y="341" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">AUTHENTICATED</text>
  </g>
</svg>
