<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1322" />
      <stop offset="50%" stop-color="#12233a" />
      <stop offset="100%" stop-color="#08101e" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Main Window -->
  <rect x="80" y="80" width="1040" height="515" rx="16" fill="#0b1b30" stroke="#1c385c" stroke-width="2" />
  
  <!-- Header -->
  <rect x="80" y="80" width="1040" height="52" rx="16" fill="#102542" />
  <rect x="80" y="116" width="1040" height="16" fill="#102542" />
  <circle cx="115" cy="106" r="6" fill="#ef4444" />
  <circle cx="135" cy="106" r="6" fill="#f59e0b" />
  <circle cx="155" cy="106" r="6" fill="#10b981" />
  <text x="600" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Hospital Management System (Java OOP Enterprise Edition)
  </text>

  <!-- Left Info -->
  <g transform="translate(130, 180)">
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" />
    <text x="95" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">
      JAVA ENTERPRISE OOP
    </text>

    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#f8fafc">
      Hospital Management
    </text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="url(#blueGlow)">
      Clinical Workflow Engine
    </text>

    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Doctor Scheduling, Bed Allocation &amp; Dynamic Billing
    </text>
    <text x="0" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">
      Robust OOP Architecture with Encapsulation &amp; File Persistence
    </text>

    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="170" height="65" rx="10" fill="#0d2542" stroke="#1d4ed8" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#93c5fd">DOCTOR CHAMBERS</text>
      <text x="15" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">Automated</text>

      <rect x="185" y="0" width="170" height="65" rx="10" fill="#0d2542" stroke="#1d4ed8" stroke-width="1"/>
      <text x="200" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#6ee7b7">INPATIENT ADMIT</text>
      <text x="200" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#f8fafc">Live Sync</text>
    </g>
  </g>

  <!-- Right: Architecture & Console Preview -->
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="500" height="395" rx="12" fill="#081422" stroke="#153354" stroke-width="1.5" />
    
    <rect x="0" y="0" width="500" height="36" rx="12" fill="#0e233c" />
    <text x="20" y="23" font-family="monospace" font-size="12" font-weight="600" fill="#94a3b8">TERMINAL: HMS_CORE_RUNNER</text>

    <!-- Code/Console Output -->
    <g transform="translate(25, 60)" font-family="monospace" font-size="12">
      <text y="0" fill="#38bdf8">&gt; Initializing HospitalManagementSystem v2.4...</text>
      <text y="25" fill="#4ade80">[OK] Doctor Registry loaded: 24 Specialists</text>
      <text y="50" fill="#4ade80">[OK] Bed Allocation Unit: Ward A, B, ICU active</text>
      <text y="75" fill="#f1f5f9">=============================================</text>
      <text y="100" fill="#f59e0b">PATIENT CHECK-IN DISPATCH:</text>
      <text y="125" fill="#cbd5e1">  ID: #P-8849 | Name: Alamin Rahman</text>
      <text y="150" fill="#cbd5e1">  Assigned: Dr. Farhan (Cardiology, Room 302)</text>
      <text y="175" fill="#cbd5e1">  Status: Inpatient Bed Allocated [ICU-04]</text>
      <text y="200" fill="#f1f5f9">=============================================</text>
      <text y="225" fill="#22d3ee">&gt; Generating dynamic tax &amp; insurance invoice...</text>
      <text y="250" fill="#4ade80">[SUCCESS] Billing Ledger updated and saved to disk.</text>
      <text y="285" fill="#60a5fa">&gt; System ready for new query _</text>
    </g>
  </g>
</svg>
