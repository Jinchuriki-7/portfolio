<!doctype html>
<html lang="en" data-theme="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Farhanul Haque — Computer Science & Engineering student passionate about software development, web development, and AI." />
    <meta name="author" content="Farhanul Haque" />
    <meta property="og:title" content="Farhanul Haque | Software Developer Portfolio" />
    <meta property="og:description" content="CSE Student | Software Developer | Competitive Programmer | AI Enthusiast" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F4F1E9" />
    
    <!-- Inline Theme Initializer (Defaults to 'light' / Day Mode on visit) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('user_theme_pref');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (theme === 'dark') {
            document.documentElement.classList.remove('light');
            if (metaTheme) metaTheme.setAttribute('content', '#101613');
          } else {
            document.documentElement.classList.remove('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#F4F1E9');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts: Inter + Space Grotesk + Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Farhanul Haque | Portfolio</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
